name: Build AAYA Assistant APK

on:
  push:
    branches: [ "main" ]
  pull_request:
    branches: [ "main" ]
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    name: Build Android APK
    runs-on: ubuntu-latest

    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Set up JDK 17
        uses: actions/setup-java@v5
        with:
          java-version: '17'
          distribution: 'temurin'
          cache: gradle

      - name: Grant Execute Permission to Gradlew
        run: chmod +x gradlew

      - name: Build Debug APK
        run: ./gradlew assembleDebug --stacktrace

      - name: Upload Debug APK Artifact
        uses: actions/upload-artifact@v4
        with:
          name: AAYA-AI-Assistant-Debug-APK
          path: app/build/outputs/apk/debug/app-debug.apk
          retention-days: 30

      - name: Create ZIP archive of APK
        run: zip -j AAYA-Assistant.zip app/build/outputs/apk/debug/app-debug.apk

      - name: Create GitHub Release with Direct APK and ZIP Downloads
        if: github.ref == 'refs/heads/main'
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          cat << 'EOF' > release_notes.md
          ## 🌟 AAYA v3.3.0 — Hardware Controls, Live Geocoding, Screen Time & Official Cyber Web Launch

          ### 📲 Direct 1-Click Download Links:
          * **[Download AAYA v3.3.0 APK](https://github.com/AmanYadav9516/AAYA-AI-Assistant/releases/download/v3.3.0/app-debug.apk)**
          * **[Download AAYA v3.3.0 ZIP (WhatsApp & Mobile Friendly)](https://github.com/AmanYadav9516/AAYA-AI-Assistant/releases/download/v3.3.0/AAYA-Assistant.zip)**

          ### 🚀 What's New in v3.3.0:
          - ☀️ **Hardware Screen Brightness Controls**: Hands-free brightness adjustment by voice ("brightness 50%", "full brightness", "brightness kam karo") with dedicated `WRITE_SETTINGS` permission support.
          - 🔊 **Voice Volume & Mute Controls**: Native audio control ("volume 70%", "awaaz badhao", "volume mute kardo", "awaaz kam karo").
          - 📍 **On-Device Live Geocoding & PIN Code**: Instant live reverse geocoding ("mera pin code kya hai", "kaunsa district hai", "meri live location batao", "state aur country batao") without external API costs.
          - 🗺️ **Jaipur Distance & Nearby Discovery**: Ask "Jaipur se kitni doori hai" or "nearest coffee shop", "near barber", "5 star hotels near me" to auto-open mapped search.
          - 🎵 **Local Music Player vs. YouTube**: Say "music chalao" / "open music player" to open offline phone songs, or "play [song]" to stream directly on YouTube.
          - 💬 **Direct Background SMS Bug Fix**: Enhanced regex contact & message extraction ("Aman ko SMS bhejo ki main late hoon") ensures 100% accurate recipient resolution and background dispatch.
          - 📊 **Screen Time & App Usage Tracking**: Ask "aaj kitna phone chalaya" or "app usage summary" to get exact screen time breakdown and top 3 apps used today.
          - 🌐 **Polite Gemini High-Traffic Fallback**: Helpful Indian context notification when Google AI servers experience high traffic bursts.
          - 🫧 **Realme/Oppo/OnePlus Siri Pop-Up**: Translucent floating Compose card with animated audio visualizer and aurora glow over any app.
          - 🚀 **Official Cyber Landing Page**: Added `website/` package ready for 1-click deployment on Netlify or Vercel with kinetic scroll animations, soundwave simulator, and direct APK download buttons.
          EOF

          gh release delete v3.3.0 --yes || true
          gh release create v3.3.0 \
            app/build/outputs/apk/debug/app-debug.apk \
            AAYA-Assistant.zip \
            --title "AAYA AI Assistant v3.3.0 APK (Hardware Controls, Live Geocoding & Cyber Web Launch)" \
            --notes-file release_notes.md
