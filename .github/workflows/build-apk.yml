name: Build AAYA Assistant APK

on:
  push:
    branches: [ "main" ]
  pull_request:
    branches: [ "main" ]
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    name: Build Android APK
    runs-on: ubuntu-latest

    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Set up JDK 17
        uses: actions/setup-java@v5
        with:
          java-version: '17'
          distribution: 'temurin'
          cache: gradle

      - name: Grant Execute Permission to Gradlew
        run: chmod +x gradlew

      - name: Build Debug APK
        run: ./gradlew assembleDebug --stacktrace

      - name: Upload Debug APK Artifact
        uses: actions/upload-artifact@v4
        with:
          name: AAYA-AI-Assistant-Debug-APK
          path: app/build/outputs/apk/debug/app-debug.apk
          retention-days: 30

      - name: Create ZIP archive of APK
        run: zip -j AAYA-Assistant.zip app/build/outputs/apk/debug/app-debug.apk

      - name: Create GitHub Release with Direct APK and ZIP Downloads
        if: github.ref == 'refs/heads/main'
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          cat << 'EOF' > release_notes.md
          ## 🌟 AAYA v2.0.0 — The Mega Companion & Intelligence Upgrade

          ### 📲 Direct 1-Click Download Links:
          * **[Download AAYA v2.0.0 APK](https://github.com/AmanYadav9516/AAYA-AI-Assistant/releases/download/v2.0.0/app-debug.apk)**
          * **[Download AAYA v2.0.0 ZIP (WhatsApp & Mobile Friendly)](https://github.com/AmanYadav9516/AAYA-AI-Assistant/releases/download/v2.0.0/AAYA-Assistant.zip)**

          ### 🚀 What's New in v2.0.0:
          - ⚡ **Multi-AI Engine & Failover**: Google Gemini (`gemini-3.6-flash`) with automatic 503 retry + OpenRouter free tier fallback (`llama-3.3-70b` / `gemini-2.0-flash`). Switchable in Settings.
          - 🎙️ **Voice Studio & Speech Customizer**: 5 distinct voice presets (Female, Male, Child, Old Man, Robot) + fine-tune Pitch and Speed sliders with 1-tap live voice test.
          - 🔇 **Zero Command Repetition**: Instant flush of prior TTS speech queue (`stop()` barge-in) and cleaned command history so assistant never echoes previous actions.
          - 🪔 **Indian Hindu & National Festival Generator**: Automatic detection of upcoming Indian festivals (Diwali, Holi, Raksha Bandhan, Eid, Independence Day) with beautiful heart-touching wishes for all people and 1-tap WhatsApp sharing.
          - ☀️ **Bilingual Daily Inspiration ("Suvichar")**: Curated morning and daily motivational quotes in Hindi and English by Swami Vivekananda, APJ Abdul Kalam, and more, complete with voice playback.
          - 💧 **Water & Rest Guardian**: Caring proactive notifications addressing you by your name ("Hey Manish, drink water & take rest!").
          - 💰 **Voice Pocket Expense Tracker ("Hisab-Kitab")**: Log daily expenses ("Chai ₹20", "Auto ₹60") by voice and track total spends today and all-time in the Personal Hub.
          - 🚨 **Emergency SOS Beacon**: Fast voice-activated flashlight strobe beacon for night safety or emergency defense.
          - 🔋 **Smart Battery 100% Unplug Alert**: Audio chime when phone reaches full charge to extend battery health.
          - 💬 **WhatsApp Dictation & Messaging**: Compose and send WhatsApp messages directly via hands-free voice intent.
          - 🛡️ **100% On-Device Local Room Storage**: Zero cloud lock-in; expenses, notes, reminders, and user profiles remain 100% local and private.
          EOF

          gh release delete v2.0.0 --yes || true
          gh release create v2.0.0 \
            app/build/outputs/apk/debug/app-debug.apk \
            AAYA-Assistant.zip \
            --title "AAYA AI Assistant v2.0.0 APK (Mega Companion Upgrade)" \
            --notes-file release_notes.md
