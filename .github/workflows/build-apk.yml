name: Build AAYA Assistant APK

on:
  push:
    branches: [ "main" ]
  pull_request:
    branches: [ "main" ]
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    name: Build Android APK
    runs-on: ubuntu-latest

    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Set up JDK 17
        uses: actions/setup-java@v5
        with:
          java-version: '17'
          distribution: 'temurin'
          cache: gradle

      - name: Grant Execute Permission to Gradlew
        run: chmod +x gradlew

      - name: Build Debug APK
        run: ./gradlew assembleDebug --stacktrace

      - name: Upload Debug APK Artifact
        uses: actions/upload-artifact@v4
        with:
          name: AAYA-AI-Assistant-Debug-APK
          path: app/build/outputs/apk/debug/app-debug.apk
          retention-days: 30

      - name: Create ZIP archive of APK
        run: zip -j AAYA-Assistant.zip app/build/outputs/apk/debug/app-debug.apk

      - name: Create GitHub Release with Direct APK and ZIP Downloads
        if: github.ref == 'refs/heads/main'
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          cat << 'EOF' > release_notes.md
          ## 🌟 AAYA v1.0.3 — Premium Intelligence & Gemini 3.6 Flash Upgrade

          ### 📲 Direct 1-Click Download Links:
          * **[Download AAYA v1.0.3 APK](https://github.com/AmanYadav9516/AAYA-AI-Assistant/releases/download/v1.0.3/app-debug.apk)**
          * **[Download AAYA v1.0.3 ZIP (WhatsApp & Mobile Friendly)](https://github.com/AmanYadav9516/AAYA-AI-Assistant/releases/download/v1.0.3/AAYA-Assistant.zip)**

          ### 🚀 What's New in v1.0.3:
          - ⚡ **Gemini 3.6 Flash Engine**: Completely resolved 404 model error; full, native support for all Google AI Studio developer keys (`AQ...` and `AIzaSy...`).
          - 🔄 **Multi-Turn Follow-Up Conversations**: Maintains conversational history across turns ("Set alarm for 7" -> "What should I name it?" -> "College").
          - 🧠 **Multi-Action Commands**: Executes complex multi-step voice requests ("Set alarm for 7, turn on torch, and activate sleep mode").
          - 🔐 **Permission-Aware AI**: Contextual, friendly voice guidance instead of errors when permissions are missing ("I need Contacts access to identify Mummy...").
          - 🧾 **Trust & Audit Log ("What did you do today?")**: Transparent tracking of every alarm, note, call, focus session, and AI request performed on your device.
          - 📝 **Smart Notes & Shopping Lists**: Save notes by category (College, Ideas, Personal, Notes) and manage shopping items with voice ("Add milk and eggs", "What is on my shopping list?", "Mark eggs as purchased").
          - 📷 **Camera Assistant**: Take photos, selfies, record videos, or trigger a 10-second photo timer via voice.
          - ⏰ **Time-Based Scheduled Actions & Calls**: Schedule future reminders and call prompts ("At 12 PM call Mom", "In 30 minutes remind me to study") via AlarmManager.
          - 🎓 **Student Mode, Daily Planner & Study Focus Timer**: Ask "Plan my day", start timed focus study sessions with automatic DND, and manage class timetables.
          - 📊 **Personal Dashboard UI**: Redesigned Home screen with dynamic time-based greetings, Next Up card, quick action chips, and privacy status.
          - 🛡️ **100% On-Device Local Data Storage**: All notes, shopping lists, schedules, and memories stay strictly on the user's phone.
          EOF

          gh release delete v1.0.3 --yes || true
          gh release create v1.0.3 \
            app/build/outputs/apk/debug/app-debug.apk \
            AAYA-Assistant.zip \
            --title "AAYA AI Assistant v1.0.3 APK (Gemini 3.6 Flash & Premium Features)" \
            --notes-file release_notes.md
