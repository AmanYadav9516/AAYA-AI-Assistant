name: Build AAYA Assistant APK

on:
  push:
    branches: [ "main" ]
  pull_request:
    branches: [ "main" ]
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    name: Build Android APK
    runs-on: ubuntu-latest

    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Set up JDK 17
        uses: actions/setup-java@v5
        with:
          java-version: '17'
          distribution: 'temurin'
          cache: gradle

      - name: Grant Execute Permission to Gradlew
        run: chmod +x gradlew

      - name: Build Debug APK
        run: ./gradlew assembleDebug --stacktrace

      - name: Upload Debug APK Artifact
        uses: actions/upload-artifact@v4
        with:
          name: AAYA-AI-Assistant-Debug-APK
          path: app/build/outputs/apk/debug/app-debug.apk
          retention-days: 30

      - name: Create ZIP archive of APK
        run: zip -j AAYA-Assistant.zip app/build/outputs/apk/debug/app-debug.apk

      - name: Create GitHub Release with Direct APK and ZIP Downloads
        if: github.ref == 'refs/heads/main'
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          cat << 'EOF' > release_notes.md
          ## 🌟 AAYA v3.1.0 — Sovereign Voice Architecture & Multi-Modal Wake Engine

          ### 📲 Direct 1-Click Download Links:
          * **[Download AAYA v3.1.0 APK](https://github.com/AmanYadav9516/AAYA-AI-Assistant/releases/download/v3.1.0/app-debug.apk)**
          * **[Download AAYA v3.1.0 ZIP (WhatsApp & Mobile Friendly)](https://github.com/AmanYadav9516/AAYA-AI-Assistant/releases/download/v3.1.0/AAYA-Assistant.zip)**

          ### 🚀 What's New in v3.1.0:
          - 🧠 **Unified VoiceSessionManager & Strict State Machine**:
            - Fixed premature speech cutoff! Supports seamless **Single-Breath** ("Hey AAYA make a call to mom") and **Two-Stage** ("Hey AAYA" -> prompt -> "Call mom") voice commands.
            - Permanently eliminated mic rapid on-off flickering and beep loops.
            - Mutes microphone during AAYA speech (TTS) to strictly prevent self-voice feedback loops.
          - ⚡ **Multi-Modal Wake Activation**:
            - 🎙️ **Voice Wake**: "Hey AAYA", "AAYA Suno", "Suno AAYA" while screen is ON.
            - 🔘 **Hardware Shortcut**: Press **Volume Up + Volume Down** simultaneously to wake AAYA immediately from any app or game.
            - ⚡ **Quick Settings Tile**: Added **"AAYA Assistant"** tile to the notification drawer for instant 1-tap activation.
            - 🔔 **Permanent Notification Action**: Added interactive **[ 🎙️ Ask AAYA ]** button in the notification panel.
            - 🎧 **Bluetooth Earphone Button**: Double-press or hold call/media button on Bluetooth headsets/earphones to wake hands-free.
            - 📳 **Shake to Wake**: Shake device with custom sensitivity to wake AAYA.
          - 💡 **Realme / Oppo / Vivo Optimization Guide**: Clear in-app guidance for ColorOS/Realme UI auto-launch and battery settings.
          - 🛡️ **100% On-Device Privacy Guaranteed**: Room SQLite database keeps all your data strictly on your phone.
          EOF

          gh release delete v3.1.0 --yes || true
          gh release create v3.1.0 \
            app/build/outputs/apk/debug/app-debug.apk \
            AAYA-Assistant.zip \
            --title "AAYA AI Assistant v3.1.0 APK (VoiceSessionManager & Multi-Modal Wake)" \
            --notes-file release_notes.md
