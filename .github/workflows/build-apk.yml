name: Build AAYA Assistant APK

on:
  push:
    branches: [ "main" ]
  pull_request:
    branches: [ "main" ]
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    name: Build Android APK
    runs-on: ubuntu-latest

    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Set up JDK 17
        uses: actions/setup-java@v5
        with:
          java-version: '17'
          distribution: 'temurin'
          cache: gradle

      - name: Grant Execute Permission to Gradlew
        run: chmod +x gradlew

      - name: Build Debug APK & App Bundle (AAB)
        run: |
          ./gradlew assembleDebug --stacktrace
          ./gradlew bundleDebug --stacktrace

      - name: Print Keystore SHA-1 & SHA-256 Fingerprints for Firebase
        run: |
          echo "=== APK CERTIFICATE FINGERPRINTS FOR FIREBASE ==="
          keytool -printcert -jarfile app/build/outputs/apk/debug/app-debug.apk || true
          ./gradlew signingReport || true

      - name: Upload Debug APK Artifact
        uses: actions/upload-artifact@v4
        with:
          name: AAYA-AI-Assistant-Debug-APK
          path: app/build/outputs/apk/debug/app-debug.apk
          retention-days: 30

      - name: Upload Debug AAB Artifact
        uses: actions/upload-artifact@v4
        with:
          name: AAYA-AI-Assistant-App-Bundle
          path: app/build/outputs/bundle/debug/app-debug.aab
          retention-days: 30

      - name: Create ZIP archive of APK
        run: |
          zip -j AAYA-Assistant.zip app/build/outputs/apk/debug/app-debug.apk
          cp app/build/outputs/bundle/debug/app-debug.aab ./AAYA-Assistant.aab

      - name: Create GitHub Release with Direct APK and ZIP Downloads
        if: github.ref == 'refs/heads/main'
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          cat << 'EOF' > release_notes.md
          ## 🌟 AAYA v3.4.1 — AAYA'S SYSTUM, Zero-Install Audio Jam, Dynamic Wallpaper Studio & Smart Dynamic Island

          ### 📲 Direct 1-Click Download Links:
          * **[Download AAYA v3.4.1 APK](https://github.com/AmanYadav9516/AAYA-AI-Assistant/releases/download/v3.4.1/app-debug.apk)**
          * **[Download AAYA v3.4.1 AAB (Google Play Store Bundle)](https://github.com/AmanYadav9516/AAYA-AI-Assistant/releases/download/v3.4.1/AAYA-Assistant.aab)**
          * **[Download AAYA v3.4.1 ZIP (WhatsApp & Mobile Friendly)](https://github.com/AmanYadav9516/AAYA-AI-Assistant/releases/download/v3.4.1/AAYA-Assistant.zip)**

          ### 🚀 What's New in v3.4.1:
          - 🎛️ **AAYA'S SYSTUM Central Hub**: Dedicated high-performance control center tab organizing Audio Jam, Wallpaper Studio, AAYA Tunes, and Performance Booster with zero lag and cyber-neon styling.
          - 📡 **Zero-Install Audio Jam (WebCast + QR Code)**: Integrated local HTTP WebCast server (`:8080`) with animated radar sweep and dynamic QR code. Friends and nearby devices (Android, iPhone, PC, Mac, TV) **do NOT need AAYA installed**—scan QR code to stream instantly in Chrome/Safari!
          - 🎨 **Dynamic Wallpaper Studio (1-Tap Apply)**: Curated 4K collections (*AMOLED Dark, Cyberpunk, Aesthetic Lo-Fi, Anime 3D, Devotional, Nature, Minimalist*). 1-tap direct apply to Home/Lock/Both screens via Android `WallpaperManager` without saving to gallery. Voice trigger: *"Hey AAYA, change my wallpaper"*.
          - 🏝️ **Ambient Dynamic Island Music Pill**: Sleek floating capsule widget with spinning vinyl, live track details, and instant play/pause controls above bottom navigation.
          - ⚡ **Battery & Device Performance Booster**: Voice commands (*"Hey AAYA, optimize my phone"*, *"phone clean karo"*) to free RAM, run GC, check battery status, and report results in Hindi/English voice.
          - 🌅 **Bilingual Smart Morning Briefing**: Voice command (*"Good morning AAYA"*, *"Subah bakhair"*) gives personalized morning update with user name, today's date, pending reminders, and Daily Inspiration Quote.
          - 🎵 **Multi-Format Offline Local Music Scanner in AAYA Tunes**: Automatically scans internal storage for **MP3, MPEG, M4A, AAC, WAV, FLAC, and OGG** under "Device Storage (Local)".
          EOF

          gh release delete v3.4.1 --yes || true
          gh release create v3.4.1 \
            app/build/outputs/apk/debug/app-debug.apk \
            AAYA-Assistant.aab \
            AAYA-Assistant.zip \
            --title "AAYA AI Assistant v3.4.1 APK & AAB (AAYA'S SYSTUM, Audio Jam QR WebCast & Wallpaper Studio)" \
            --notes-file release_notes.md
