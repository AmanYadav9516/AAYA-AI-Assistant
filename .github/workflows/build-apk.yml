name: Build AAYA Assistant APK

on:
  push:
    branches: [ "main" ]
  pull_request:
    branches: [ "main" ]
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    name: Build Android APK
    runs-on: ubuntu-latest

    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Set up JDK 17
        uses: actions/setup-java@v5
        with:
          java-version: '17'
          distribution: 'temurin'
          cache: gradle

      - name: Grant Execute Permission to Gradlew
        run: chmod +x gradlew

      - name: Build Debug APK
        run: ./gradlew assembleDebug --stacktrace

      - name: Upload Debug APK Artifact
        uses: actions/upload-artifact@v4
        with:
          name: AAYA-AI-Assistant-Debug-APK
          path: app/build/outputs/apk/debug/app-debug.apk
          retention-days: 30

      - name: Create ZIP archive of APK
        run: zip -j AAYA-Assistant.zip app/build/outputs/apk/debug/app-debug.apk

      - name: Create GitHub Release with Direct APK and ZIP Downloads
        if: github.ref == 'refs/heads/main'
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          cat << 'EOF' > release_notes.md
          ## 🌟 AAYA v3.0.0 — Sovereign Voice Companion & Life Automation

          ### 📲 Direct 1-Click Download Links:
          * **[Download AAYA v3.0.0 APK](https://github.com/AmanYadav9516/AAYA-AI-Assistant/releases/download/v3.0.0/app-debug.apk)**
          * **[Download AAYA v3.0.0 ZIP (WhatsApp & Mobile Friendly)](https://github.com/AmanYadav9516/AAYA-AI-Assistant/releases/download/v3.0.0/AAYA-Assistant.zip)**

          ### 🚀 What's New in v3.0.0:
          - 🎙️ **Background Wake-Word & Floating Overlay**: Say "Hey AAYA", "AAYA Suno", or "AAYA" anytime while screen is ON across WhatsApp, YouTube, or games! Siri-style glowing neon pill overlay drops volume and listens.
          - 🚗 **Driving Mode & Caller Announcer**: Speaks incoming caller name aloud over ringtone. Say "Uthao" to auto-answer on speakerphone!
          - 📍 **Smart Location Commander (Geofencing)**: "Office pahuchte hi mummy ko auto message kar dena" — automatically dispatches SMS on arrival without opening any screen.
          - 💊 **Dawai Wala Doctor**: Persistent caring voice alarm at medicine time repeating until you say "Pee li".
          - ⏱️ **App Usage Police**: Automatically warns and exits distracting apps like Instagram when daily limit is reached.
          - 📸 **Hands-Free Voice Camera**: "Ek photo kheench de" triggers a 3-second audio countdown ("Smile! 3... 2... 1...") and snaps a photo without touching.
          - 🎵 **YouTube Auto-Play & Music Sleep Timer**: "Hanuman Chalisa chala de" opens and plays immediately; "30 min baad gaana band kar dena" automatically pauses media.
          - 🧠 **Deep Memory & Natural Recall**: Ask "Mera timetable kya hai", "Meri dawai ka naam kya hai", "Papa ka naam kya hai", or "Aakhiri call kiski thi".
          - 🌐 **Web Intelligence & Hindi/Hinglish Voice**: Instant weather and facts without burning AI tokens; native Hindi (हिंदी) and Hinglish speech support.
          - 🛡️ **100% On-Device Privacy Guaranteed**: Room SQLite database keeps all your data strictly on your phone.
          EOF

          gh release delete v3.0.0 --yes || true
          gh release create v3.0.0 \
            app/build/outputs/apk/debug/app-debug.apk \
            AAYA-Assistant.zip \
            --title "AAYA AI Assistant v3.0.0 APK (Sovereign Companion Upgrade)" \
            --notes-file release_notes.md
