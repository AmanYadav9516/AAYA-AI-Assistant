name: Build AAYA Assistant APK

on:
  push:
    branches: [ "main" ]
  pull_request:
    branches: [ "main" ]
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    name: Build Android APK
    runs-on: ubuntu-latest

    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Set up JDK 17
        uses: actions/setup-java@v5
        with:
          java-version: '17'
          distribution: 'temurin'
          cache: gradle

      - name: Grant Execute Permission to Gradlew
        run: chmod +x gradlew

      - name: Build Debug APK
        run: ./gradlew assembleDebug --stacktrace

      - name: Upload Debug APK Artifact
        uses: actions/upload-artifact@v4
        with:
          name: AAYA-AI-Assistant-Debug-APK
          path: app/build/outputs/apk/debug/app-debug.apk
          retention-days: 30

      - name: Create ZIP archive of APK
        run: zip -j AAYA-Assistant.zip app/build/outputs/apk/debug/app-debug.apk

      - name: Create GitHub Release with Direct APK and ZIP Downloads
        if: github.ref == 'refs/heads/main'
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          cat << 'EOF' > release_notes.md
          ## 🌟 AAYA v3.1.0 — Power-Button System Assistant & Multi-Command Engine

          ### 📲 Direct 1-Click Download Links:
          * **[Download AAYA v3.1.0 APK](https://github.com/AmanYadav9516/AAYA-AI-Assistant/releases/download/v3.1.0/app-debug.apk)**
          * **[Download AAYA v3.1.0 ZIP (WhatsApp & Mobile Friendly)](https://github.com/AmanYadav9516/AAYA-AI-Assistant/releases/download/v3.1.0/AAYA-Assistant.zip)**

          ### 🚀 What's New in v3.1.0:
          - ⚡ **Power-Button & Default Assistant (0% Idle Battery Drain)**: Long-press power button (0.5s) on Realme, Oppo, OnePlus & any Android device or use corner swipe to instantly summon AAYA!
          - 🫧 **Siri Floating Overlay (No Full App Open)**: Triggers translucent overlay over WhatsApp, YouTube, and games without interrupting your foreground app. Audio automatically ducks by 80%.
          - 🔗 **Multi-Command Queue**: Handles chained commands in a single breath (*"Set medicine reminder for 5 min AND call mom"*).
          - 📸 **Voice Screenshots**: Say *"Take screenshot"* or *"Screenshot lo"* to snap screen touch-free via Android Accessibility Service.
          - 🔙 **Jetpack Compose Navigation Fix**: Back button on Settings, Memory, and Routines tabs returns to Home screen instead of quitting the app.
          - 💾 **Dedicated Save/Edit Profile Controls**: Visual Save buttons with green checkmarks for User Name, Assistant Name, and API keys.
          - 🛡️ **Special Permissions Wizard**: 1-click links for Realme, Oppo, and OnePlus Special App Access (Display Over Apps, Default Assistant, Accessibility).
          - 🚗 **Driving Mode & Caller Announcer**: Speaks caller name aloud over ringtone. Say "Uthao" to answer on speakerphone!
          - 💊 **Persistent Dawai Doctor & Health Reminders**: Continuous voice reminders until you say "Pee li".
          - 🌐 **Free Web Intelligence & Offline Commands**: Instant weather and facts without consuming AI tokens.
          - 🔒 **100% On-Device Local SQLite Privacy**: All memories, schedules, and notes stay strictly on your phone.
          EOF

          gh release delete v3.1.0 --yes || true
          gh release create v3.1.0 \
            app/build/outputs/apk/debug/app-debug.apk \
            AAYA-Assistant.zip \
            --title "AAYA AI Assistant v3.1.0 APK (Power-Button System Upgrade)" \
            --notes-file release_notes.md
