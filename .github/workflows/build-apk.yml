name: Build AAYA Assistant APK

on:
  push:
    branches: [ "main" ]
  pull_request:
    branches: [ "main" ]
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    name: Build Android APK
    runs-on: ubuntu-latest

    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Set up JDK 17
        uses: actions/setup-java@v5
        with:
          java-version: '17'
          distribution: 'temurin'
          cache: gradle

      - name: Grant Execute Permission to Gradlew
        run: chmod +x gradlew

      - name: Build Debug APK
        run: ./gradlew assembleDebug --stacktrace

      - name: Print Keystore SHA-1 & SHA-256 Fingerprints for Firebase
        run: |
          echo "=== APK CERTIFICATE FINGERPRINTS FOR FIREBASE ==="
          keytool -printcert -jarfile app/build/outputs/apk/debug/app-debug.apk || true
          ./gradlew signingReport || true

      - name: Upload Debug APK Artifact
        uses: actions/upload-artifact@v4
        with:
          name: AAYA-AI-Assistant-Debug-APK
          path: app/build/outputs/apk/debug/app-debug.apk
          retention-days: 30

      - name: Create ZIP archive of APK
        run: zip -j AAYA-Assistant.zip app/build/outputs/apk/debug/app-debug.apk

      - name: Create GitHub Release with Direct APK and ZIP Downloads
        if: github.ref == 'refs/heads/main'
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          cat << 'EOF' > release_notes.md
          ## 🌟 AAYA v3.4.0 — New 3D Identity, Scheduled SMS, Firebase $0 Backend & Voice Upgrade

          ### 📲 Direct 1-Click Download Links:
          * **[Download AAYA v3.4.0 APK](https://github.com/AmanYadav9516/AAYA-AI-Assistant/releases/download/v3.4.0/app-debug.apk)**
          * **[Download AAYA v3.4.0 ZIP (WhatsApp & Mobile Friendly)](https://github.com/AmanYadav9516/AAYA-AI-Assistant/releases/download/v3.4.0/AAYA-Assistant.zip)**

          ### 🚀 What's New in v3.4.0:
          - 🎨 **New Official 3D Logo Icon**: Premium 3D blue-cyan gradient "A" emblem on obsidian squircle across all app launcher icons and web assets.
          - 💖 **3D Claymorphic Login Experience**: Soft 3D companion character, 1-tap Google Sign-In, and Guest Mode offline bypass.
          - 🎙️ **Voice Articulation & Pronunciation Upgrade**: Eliminates "A - A - Y - A" letter-by-letter spelling. Natural bilingual Indian pronunciation for Hindi, English, and Hinglish. Working voice filters.
          - 🛡️ **Permanent Fresh Install Startup Crash Elimination**: Android 14 foreground microphone service guarded until runtime permission is confirmed.
          - ⏰ **Scheduled SMS with AI Wishes & Emojis**: Schedule messages to contacts at any date/time (12 AM midnight, 5 PM, 10:30 AM) with automated emoji wishes in Hindi/Hinglish/English and high-priority delivery alerts.
          - 🧠 **Memory & Task Recall**: Seamlessly answers "what is my mom name", "college time", and "today's tasks".
          - ☀️ **Realme/ColorOS Brightness & Volume Fix**: Hardware commands take precedence over Android settings.
          - 🗺️ **Visual Photo Search & Route Navigation**: Direct Google Images search and Google Maps turn-by-turn driving routes.
          - ☁️ **$0 Firebase User Management**: Live user tracking, daily request counting, and admin block control via Firebase Console.
          EOF

          gh release delete v3.4.0 --yes || true
          gh release create v3.4.0 \
            app/build/outputs/apk/debug/app-debug.apk \
            AAYA-Assistant.zip \
            --title "AAYA AI Assistant v3.4.0 APK (3D Visual Identity, Scheduled SMS & $0 Backend)" \
            --notes-file release_notes.md
