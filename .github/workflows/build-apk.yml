name: Build AAYA Assistant APK

on:
  push:
    branches: [ "main" ]
  pull_request:
    branches: [ "main" ]
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    name: Build Android APK
    runs-on: ubuntu-latest

    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          java-version: '17'
          distribution: 'temurin'
          cache: gradle

      - name: Grant Execute Permission to Gradlew
        run: chmod +x gradlew

      - name: Build Debug APK
        run: ./gradlew assembleDebug --stacktrace

      - name: Upload Debug APK Artifact
        uses: actions/upload-artifact@v4
        with:
          name: AAYA-AI-Assistant-Debug-APK
          path: app/build/outputs/apk/debug/app-debug.apk
          retention-days: 30

      - name: Create ZIP archive of APK
        run: zip -j AAYA-Assistant.zip app/build/outputs/apk/debug/app-debug.apk

      - name: Create or Update GitHub Release with Direct APK Download
        uses: softprops/action-gh-release@v2
        if: github.ref == 'refs/heads/main'
        with:
          files: |
            app/build/outputs/apk/debug/app-debug.apk
            AAYA-Assistant.zip
          name: "AAYA AI Assistant v1.0.2 APK (API Auth & Offline Routing Fix)"
          tag_name: "v1.0.2"
          draft: false
          prerelease: false
          body: |
            ## 🌟 AAYA v1.0.2 — API Auth & Offline Routing Update
            
            ### 📲 Direct 1-Click Download Links:
            * **[Download AAYA v1.0.2 APK](https://github.com/AmanYadav9516/AAYA-AI-Assistant/releases/download/v1.0.2/app-debug.apk)**
            * **[Download AAYA v1.0.2 ZIP (WhatsApp & Mobile Friendly)](https://github.com/AmanYadav9516/AAYA-AI-Assistant/releases/download/v1.0.2/AAYA-Assistant.zip)**
            
            ### Fixes included in v1.0.2:
            - 🔑 **API Auth 401 Fix**: Uses official `x-goog-api-key` header & query param for all Google AI Studio keys (`AIzaSy...` & `AQ...`).
            - 🔦 **100% Offline Torch/Flashlight**: Matches flexible phrasing ("Turn on torch", "Torch on", "Torch jalao") locally without internet.
            - ⚙️ **100% Offline Settings & Wi-Fi**: Directly launches Settings & Wi-Fi controls locally.
            
            ### Included in this build:
            - 🎙️ **Streaming Speech Recognition & Interruption (Barge-in)**
            - 📳 **Shake to Wake** (Active only when device screen is ON)
            - ⚡ **Fast Local Command Router (<50ms)** + **Gemini AI Brain (Tool Calling)**
            - 👥 **Multilingual Contact Understanding** (Hinglish/Hindi/English: "Mummy ko call karo", "Papa ko phone lagao")
            - 🌙 **Lifestyle Intelligence** (Sleep Mode, Class/Study Mode, VIP Contact Call Bypass)
            - 🚨 **Emergency Double-Call Rule** (2 calls within 3 mins rings through DND)
            - 🛡️ **Dynamic 5-Step Permission Wizard** (Real-time ❌ to ✅ status updates)
            - 🧠 **User-Controlled Memory Dashboard** (View, edit, or forget anything)
            - ⚙️ **Live API Diagnostics & Ping** (Live status, latency, request counter)
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
