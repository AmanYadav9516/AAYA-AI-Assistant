name: Build AAYA Assistant APK

on:
  push:
    branches: [ "main" ]
  pull_request:
    branches: [ "main" ]
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    name: Build Android APK
    runs-on: ubuntu-latest

    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Set up JDK 17
        uses: actions/setup-java@v5
        with:
          java-version: '17'
          distribution: 'temurin'
          cache: gradle

      - name: Grant Execute Permission to Gradlew
        run: chmod +x gradlew

      - name: Build Debug APK
        run: ./gradlew assembleDebug --stacktrace

      - name: Upload Debug APK Artifact
        uses: actions/upload-artifact@v4
        with:
          name: AAYA-AI-Assistant-Debug-APK
          path: app/build/outputs/apk/debug/app-debug.apk
          retention-days: 30

      - name: Create ZIP archive of APK
        run: zip -j AAYA-Assistant.zip app/build/outputs/apk/debug/app-debug.apk

      - name: Create GitHub Release with Direct APK and ZIP Downloads
        if: github.ref == 'refs/heads/main'
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          cat << 'EOF' > release_notes.md
          ## 🌟 AAYA v3.2.0 — Siri Animated Pop-Up & Zero Mic Flicker Upgrade

          ### 📲 Direct 1-Click Download Links:
          * **[Download AAYA v3.2.0 APK](https://github.com/AmanYadav9516/AAYA-AI-Assistant/releases/download/v3.2.0/app-debug.apk)**
          * **[Download AAYA v3.2.0 ZIP (WhatsApp & Mobile Friendly)](https://github.com/AmanYadav9516/AAYA-AI-Assistant/releases/download/v3.2.0/AAYA-Assistant.zip)**

          ### 🚀 What's New in v3.2.0:
          - 🫧 **Realme, Oppo & OnePlus Bulletproof Siri Pop-Up**: Bypasses ColorOS background overlay blocking using a Translucent Compose Window (`Theme.AayaAssistant.Translucent`) with its own foreground window token. Renders 100% reliably over WhatsApp, YouTube, Games, and Home Screen!
          - 🎨 **Futuristic Siri Dancing Soundwave & Aurora Border**: 5 dynamic dancing audio waveform bars reacting in real-time to your voice volume, surrounded by a shimmering Neon Cyan, Electric Violet, and Hot Magenta rotating aura.
          - 🔇 **Zero Mic Flicker & 0% Idle Battery Drain**: Background passive speech loop permanently eliminated. Phone microphone NEVER turns ON/OFF/ON/OFF in the background. Mic activates ONLY when summoned!
          - ⏱️ **Strict 5-Second Silence Sleep Timer**: Summon AAYA via Power-Button hold (0.5s) or assist gesture. If you don't speak within 5 seconds, AAYA smoothly closes the pop-up and sleeps silently (zero error tone, zero loops).
          - ⚡ **Single-Shot Voice Command Execution**: Speaks your command ("Hello", "Call Mom", "Torch on", "Take screenshot", etc.). Mic shuts OFF immediately, command runs in background, speaks response, and dismisses cleanly.
          - 🌅 **Dynamic Morning & Weather Briefings**: Proactive morning wake-up with live weather reports, evening wind-down, and 20+ non-repetitive caring hydration alerts addressing user by name.
          - 🛡️ **All 20+ Core Features 100% Intact**: Hands-free calling on speaker, auto SMS, geofencing, driving mode caller announcer, app usage police, Dawai doctor, camera timers, voice screenshots, and Gemini AI intelligence.
          EOF

          gh release delete v3.2.0 --yes || true
          gh release create v3.2.0 \
            app/build/outputs/apk/debug/app-debug.apk \
            AAYA-Assistant.zip \
            --title "AAYA AI Assistant v3.2.0 APK (Siri Animated Pop-up & Zero Mic Flicker)" \
            --notes-file release_notes.md
